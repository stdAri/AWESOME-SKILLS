# Awesome-SKILLs Registry
# 以 repo 为单位管理
# 字段说明：
#   name         : repo 唯一标识符（与本地目录名一致）
#   display_name : 展示名称
#   description  : 功能描述
#   repo         : 来源 GitHub 仓库
#   local_path   : 本地相对路径
#   skill_source : (可选) 远程 SKILL.md URL，sync.py 通过 SHA-256 对比检测变化
#   categories   : 所属分类
#   updated_at   : 最近同步日期（YYYY-MM-DD），由 sync.py 自动维护
#   last_commit  : 最近同步时的 HEAD commit hash（40 字符），由 sync.py 写入；
#                  下次 sync 用 `git log <hash>..HEAD` 精确对比，避免日期边界误报
#   changelog    : 更新历史列表（newest-first），由 sync.py 自动追加

